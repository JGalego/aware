repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        exclude: ^eval/tasks/   # fixtures: the buggy repos and checks are deliberately not lint-clean

  - repo: local
    hooks:
      - id: check-bash-syntax
        name: Check Bash syntax
        entry: bash -c 'for file do bash -n "$file" || exit; done' --
        language: system
        types: [shell]
